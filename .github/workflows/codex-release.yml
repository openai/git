name: Codex Git release

on:
  push:
    branches:
      - codex
      - codex-unstable

permissions:
  contents: read

concurrency:
  group: codex-git-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publication:
    name: Verify controller publication
    runs-on: ubuntu-24.04
    if: github.event.deleted == false
    outputs:
      published: ${{ steps.verify.outputs.published }}
    steps:
      - name: Check the published controller output
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
          refs/heads/codex)
            output_key=codex.output-tip
            ;;
          refs/heads/codex-unstable)
            output_key=codex-unstable.output-tip
            ;;
          *)
            printf 'unexpected release ref: %s\n' "$GITHUB_REF" >&2
            exit 1
            ;;
          esac

          meta=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/meta" \
            --jq '.object.sha')
          recorded=$(gh api \
            "repos/$GITHUB_REPOSITORY/contents/codex.config?ref=$meta" \
            -H 'Accept: application/vnd.github.raw+json' |
            git config --no-includes --file /dev/stdin \
              --get "$output_key")

          if test "$GITHUB_SHA" = "$recorded"
          then
            printf 'published=true\n' >>"$GITHUB_OUTPUT"
            printf 'Releasing controller-published commit %s.\n' "$GITHUB_SHA"
          else
            printf 'published=false\n' >>"$GITHUB_OUTPUT"
            printf 'Skipping non-controller publication %s.\n' "$GITHUB_SHA"
          fi

  version:
    name: Determine version
    needs: publication
    if: needs.publication.outputs.published == 'true'
    runs-on: ubuntu-24.04
    outputs:
      describe: ${{ steps.version.outputs.describe }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive OpenAI version from git describe
        id: version
        shell: bash
        run: |
          set -euo pipefail
          describe="$(git describe \
            --match 'v[0-9]*' \
            --exclude 'v*-openai.*' \
            --long \
            --always \
            --abbrev=12 \
            "$GITHUB_SHA")"

          if [[ "$describe" =~ ^(.+)-([0-9]+)-g([0-9a-f]+)$ ]]
          then
            upstream_tag="${BASH_REMATCH[1]}"
            version="$upstream_tag-openai.${BASH_REMATCH[2]}.g${BASH_REMATCH[3]}"
          else
            upstream_tag=
            version="openai-$describe"
          fi
          # The lanes can name the same source when no preview topics are
          # enrolled. Give their release manifests distinct immutable tags.
          if test "$GITHUB_REF_NAME" = codex-unstable
          then
            version="$version.codex-unstable"
          fi
          git check-ref-format "refs/tags/$version"
          printf 'describe=%s\n' "$describe" | tee -a "$GITHUB_OUTPUT"
          printf 'upstream_tag=%s\n' "$upstream_tag" | tee -a "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" | tee -a "$GITHUB_OUTPUT"

      - name: Check out the pinned release tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openai/git
          ref: 04e86a3a306d49bca7280ca4b2387ef55a5d4777
          path: release-tooling
          persist-credentials: false

      - name: Check out reviewed release configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: meta
          path: release-control
          persist-credentials: false

      - name: Freeze the release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM_TAG: ${{ steps.version.outputs.upstream_tag }}
        run: |
          bash release-tooling/.github/release/release.sh \
            --config release-control/.github/release/config.json --worktree release-control \
            prepare --channel "$GITHUB_REF_NAME" --source-sha "$GITHUB_SHA" \
            --version "$VERSION" --upstream-tag "$UPSTREAM_TAG" \
            --recipe-sha 04e86a3a306d49bca7280ca4b2387ef55a5d4777 --output release-inputs

      - name: Retain the frozen release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-inputs
          path: release-inputs/candidate.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: version
    uses: openai/git/.github/workflows/git-build.yml@04e86a3a306d49bca7280ca4b2387ef55a5d4777
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      upstream_tag: ${{ needs.version.outputs.upstream_tag }}
      recipe_sha: 04e86a3a306d49bca7280ca4b2387ef55a5d4777

  release:
    needs: [version, build]
    permissions:
      contents: read
      pull-requests: read
    uses: openai/git/.github/workflows/git-publish.yml@04e86a3a306d49bca7280ca4b2387ef55a5d4777
    with:
      version: ${{ needs.version.outputs.version }}
      recipe_sha: 04e86a3a306d49bca7280ca4b2387ef55a5d4777
