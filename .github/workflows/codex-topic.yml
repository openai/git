name: Validate Codex topic

on:
  workflow_call:
    inputs:
      topic:
        description: Active topic branch without refs/heads/
        required: true
        type: string
      old-topic-oid:
        description: Snapshotted live topic tip
        required: true
        type: string
      rewritten-prerequisite-oid:
        description: Rewritten prerequisite tip, or current master for a root
        required: true
        type: string
      rewritten-topic-oid:
        description: Rewritten topic tip reachable from codex-staging
        required: true
        type: string
      staging-oid:
        description: Expected refs/heads/codex-staging tip
        required: true
        type: string
      controller-oid:
        description: Exact meta commit containing this workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the controller identity
        shell: bash
        env:
          CONTROLLER_OID: ${{ inputs['controller-oid'] }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          die () {
            echo "::error::$*"
            exit 1
          }

          test "$GITHUB_REPOSITORY" = openai/git ||
            die "this workflow only validates openai/git"
          case "$CONTROLLER_OID" in
            ????????????????????????????????????????) ;;
            *) die "controller-oid must be a full 40-character object ID" ;;
          esac
          case "$CONTROLLER_OID" in
            *[!0-9a-f]*) die "controller-oid must be lowercase hexadecimal" ;;
          esac
          test "$WORKFLOW_SHA" = "$CONTROLLER_OID" ||
            die "called workflow $WORKFLOW_SHA does not match controller $CONTROLLER_OID"

      - name: Verify ${{ inputs.topic }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          OLD_TOPIC_OID: ${{ inputs['old-topic-oid'] }}
          REWRITTEN_PREREQUISITE_OID: ${{ inputs['rewritten-prerequisite-oid'] }}
          REWRITTEN_TOPIC_OID: ${{ inputs['rewritten-topic-oid'] }}
          STAGING_OID: ${{ inputs['staging-oid'] }}
        run: |
          set -euo pipefail

          api_version=2026-03-10

          die () {
            echo "::error::$*"
            exit 1
          }

          validate_oid () {
            local name=$1
            local value=$2
            case "$value" in
              ????????????????????????????????????????) ;;
              *) die "$name must be a full 40-character object ID" ;;
            esac
            case "$value" in
              *[!0-9a-f]*) die "$name must be lowercase hexadecimal" ;;
            esac
          }

          api () {
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H "X-GitHub-Api-Version: $api_version" \
              "$@"
          }

          read_ref () {
            local expected_ref=$1
            local api_ref=${expected_ref#refs/}
            local encoded_ref response actual_ref object_type object_oid
            encoded_ref=$(jq -rn --arg value "$api_ref" '$value | @uri')
            response=$(api \
              "repos/$GITHUB_REPOSITORY/git/ref/$encoded_ref") || return 1
            actual_ref=$(jq -r '.ref // empty' <<<"$response")
            object_type=$(jq -r '.object.type // empty' <<<"$response")
            object_oid=$(jq -r '.object.sha // empty' <<<"$response")
            test "$actual_ref" = "$expected_ref" || return 1
            test "$object_type" = commit || return 1
            printf '%s\n' "$object_oid"
          }

          require_ancestor () {
            local base=$1
            local head=$2
            local description=$3
            local response actual_base merge_base status
            response=$(api \
              "repos/$GITHUB_REPOSITORY/compare/$base...$head?per_page=1") ||
              die "could not compare $description"
            actual_base=$(jq -r '.base_commit.sha // empty' <<<"$response")
            merge_base=$(jq -r '.merge_base_commit.sha // empty' \
              <<<"$response")
            status=$(jq -r '.status // empty' <<<"$response")
            test "$actual_base" = "$base" ||
              die "$description resolved an unexpected base $actual_base"
            test "$merge_base" = "$base" ||
              die "$description is not an ancestor relationship"
            if test "$base" = "$head"
            then
              test "$status" = identical ||
                die "$description should be identical, not $status"
            else
              test "$status" = ahead ||
                die "$description should be ahead, not $status"
            fi
          }

          git check-ref-format "refs/heads/$TOPIC" >/dev/null 2>&1 ||
            die "topic is not a valid branch name"
          case "$TOPIC" in
            ??/codex/?*) ;;
            *) die "topic does not match ??/codex/*" ;;
          esac
          suffix=${TOPIC#??/codex/}
          case "$suffix" in
            */*) die "topic must not contain another slash" ;;
          esac
          case "$TOPIC" in
            *-wip|*-stale) die "topic is inactive because of its suffix" ;;
          esac

          validate_oid old-topic-oid "$OLD_TOPIC_OID"
          validate_oid rewritten-prerequisite-oid \
            "$REWRITTEN_PREREQUISITE_OID"
          validate_oid rewritten-topic-oid "$REWRITTEN_TOPIC_OID"
          validate_oid staging-oid "$STAGING_OID"

          staging_ready=
          observed_staging=missing
          for delay in 0 1 2 4
          do
            test "$delay" = 0 || sleep "$delay"
            if observed_staging=$(read_ref refs/heads/codex-staging \
                2>/dev/null) && test "$observed_staging" = "$STAGING_OID"
            then
              staging_ready=t
              break
            fi
          done
          test -n "$staging_ready" ||
            die "codex-staging is ${observed_staging:-missing}, expected $STAGING_OID"

          require_ancestor "$REWRITTEN_PREREQUISITE_OID" \
            "$REWRITTEN_TOPIC_OID" \
            "rewritten prerequisite -> $TOPIC"
          require_ancestor "$REWRITTEN_TOPIC_OID" "$STAGING_OID" \
            "$TOPIC -> codex-staging"

          live_topic=$(read_ref "refs/heads/$TOPIC") ||
            die "could not read the exact live topic ref refs/heads/$TOPIC"
          test "$live_topic" = "$OLD_TOPIC_OID" ||
            die "refs/heads/$TOPIC moved to $live_topic; expected $OLD_TOPIC_OID"
          live_staging=$(read_ref refs/heads/codex-staging) ||
            die "could not read the exact codex-staging ref"
          test "$live_staging" = "$STAGING_OID" ||
            die "codex-staging moved to $live_staging; expected $STAGING_OID"

          {
            echo "## $TOPIC"
            echo
            echo "Live tip: \`$OLD_TOPIC_OID\`"
            echo "Rewritten prerequisite: \`$REWRITTEN_PREREQUISITE_OID\`"
            echo "Rewritten tip: \`$REWRITTEN_TOPIC_OID\`"
            echo "Staging candidate: \`$STAGING_OID\`"
          } >>"$GITHUB_STEP_SUMMARY"
