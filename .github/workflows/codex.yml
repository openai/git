name: Refresh codex

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  merge_group:
    types:
      - checks_requested

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch'
    uses: openai/git/.github/workflows/codex.yml@meta
  admission:
    name: Codex admission
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
      pull-requests: read
    uses: openai/git/.github/workflows/codex-admission.yml@meta
