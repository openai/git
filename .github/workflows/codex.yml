name: Codex branch controller

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codex-branch-refresh
  cancel-in-progress: false

jobs:
  prepare:
    name: Rebase topics and assemble codex
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.rewrite.outputs.artifact-name }}
      candidate: ${{ steps.rewrite.outputs.candidate }}
      controller-oid: ${{ steps.rewrite.outputs.controller-oid }}
      run-attempt: ${{ steps.rewrite.outputs.run-attempt }}
      topics: ${{ steps.rewrite.outputs.topics }}
    steps:
      - name: Check out the pinned controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch and pin all inputs
        env:
          READ_TOKEN: ${{ github.token }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = openai/git
          test "$WORKFLOW_REPOSITORY" = openai/git
          basic=$(printf 'x-access-token:%s' "$READ_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic $basic" \
            fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse refs/remotes/origin/meta)" = "$WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"

      - name: Configure generated commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Rebase every topic and assemble codex
        id: rewrite
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/.github/workflows/codex-branch.sh"
          sh "$helper" rewrite \
            --base master \
            --codex codex \
            --rerere-from codex \
            --require-automation \
            --result "$RUNNER_TEMP/codex-candidate" \
            --updates "$RUNNER_TEMP/codex-updates" \
            --inputs "$RUNNER_TEMP/codex-inputs" \
            --bundle "$RUNNER_TEMP/codex.bundle" \
            --topic-tuples "$RUNNER_TEMP/codex-topic-tuples" \
            --failure "$RUNNER_TEMP/codex-conflict.md"

          candidate=$(cat "$RUNNER_TEMP/codex-candidate")
          topics=$(jq -Rnc '
            [inputs | split("\t") | {
              topic: .[0],
              old_topic_oid: .[1],
              rewritten_prerequisite_oid: .[2],
              rewritten_topic_oid: .[3]
            }]' <"$RUNNER_TEMP/codex-topic-tuples")
          echo "artifact-name=codex-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >>"$GITHUB_OUTPUT"
          echo "candidate=$candidate" >>"$GITHUB_OUTPUT"
          echo "controller-oid=$WORKFLOW_SHA" >>"$GITHUB_OUTPUT"
          echo "run-attempt=$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
          echo "topics=$topics" >>"$GITHUB_OUTPUT"

      - name: Summarize candidate
        run: |
          old_codex=$(awk -F '\t' '$1 == "codex" { print $3 }' \
            "$RUNNER_TEMP/codex-inputs")
          candidate=$(cat "$RUNNER_TEMP/codex-candidate")
          {
            echo '## Codex candidate'
            echo
            echo "Old codex: \`$old_codex\`"
            echo "Candidate: \`$candidate\`"
            echo
            echo '| Ref | Old | New |'
            echo '| --- | --- | --- |'
            awk -F '\t' \
              '{ printf "| `%s` | `%s` | `%s` |\n", $1, $2, $3 }' \
              "$RUNNER_TEMP/codex-updates"
            echo
            echo '```'
            git --no-pager diff --no-ext-diff --no-textconv \
              --stat "$old_codex" "$candidate"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Freeze the immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.rewrite.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/codex.bundle
            ${{ runner.temp }}/codex-candidate
            ${{ runner.temp }}/codex-inputs
            ${{ runner.temp }}/codex-topic-tuples
            ${{ runner.temp }}/codex-updates
          if-no-files-found: error
          retention-days: 7

      - name: Check out the candidate for controller tests
        run: |
          candidate=$(cat "$RUNNER_TEMP/codex-candidate")
          git worktree add --detach "$RUNNER_TEMP/codex-source" "$candidate"

      - name: Install controller-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            gettext \
            libcurl4-openssl-dev

      - name: Build the candidate for controller tests
        run: make -C "$RUNNER_TEMP/codex-source" -j2 DEVELOPER=1

      - name: Test the controller
        run: |
          cd "$RUNNER_TEMP/codex-source/t"
          TEST_DIRECTORY="$RUNNER_TEMP/codex-source/t" \
          GIT_BUILD_DIR="$RUNNER_TEMP/codex-source" \
          CODEX_BRANCH="$GITHUB_WORKSPACE/.github/workflows/codex-branch.sh" \
            sh "$GITHUB_WORKSPACE/t/t9905-codex-branch.sh"

      - name: Explain how to resolve a conflict
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/codex-conflict.md"
          then
            cat "$RUNNER_TEMP/codex-conflict.md" >>"$GITHUB_STEP_SUMMARY"
          fi

  stage:
    name: Stage codex and wait for full CI
    needs: prepare
    if: >-
      needs.prepare.outputs.run-attempt == format('{0}', github.run_attempt)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      staging-oid: ${{ needs.prepare.outputs.candidate }}
    steps:
      - name: Check out the pinned controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/codex-candidate

      - name: Import and verify the candidate bundle
        env:
          CONTROLLER_OID: ${{ needs.prepare.outputs.controller-oid }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$CONTROLLER_OID"
          metadata="$RUNNER_TEMP/codex-candidate"
          git bundle verify "$metadata/codex.bundle"
          git fetch "$metadata/codex.bundle" \
            refs/codex-output/candidate:refs/codex-import/candidate
          test "$(git rev-parse refs/codex-import/candidate)" = \
            "$(cat "$metadata/codex-candidate")"

      - name: Push the exact staging candidate
        id: staging
        env:
          GH_TOKEN: ${{ secrets.CODEX_BRANCH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo '::error::CODEX_BRANCH_TOKEN is required to stage codex'
            exit 1
          }
          metadata="$RUNNER_TEMP/codex-candidate"
          candidate=$(cat "$metadata/codex-candidate")
          baseline=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=codex-staging&event=push&head_sha=$candidate&per_page=100" \
            --jq '[.workflow_runs[].id] | max // 0')
          echo "baseline-run-id=$baseline" >>"$GITHUB_OUTPUT"
          gh auth setup-git
          sh "$GITHUB_WORKSPACE/.github/workflows/codex-branch.sh" stage \
            --staging codex-staging \
            --require-automation \
            --inputs "$metadata/codex-inputs" \
            --updates "$metadata/codex-updates"

      - name: Wait for CI on the exact staging SHA
        env:
          BASELINE_RUN_ID: ${{ steps.staging.outputs.baseline-run-id }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          GH_TOKEN: ${{ secrets.CODEX_BRANCH_TOKEN }}
        run: |
          set -euo pipefail
          workflow_runs="repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=codex-staging&event=push&head_sha=$CANDIDATE&per_page=100"
          run_id=
          for attempt in $(seq 1 60)
          do
            run_id=$(gh api "$workflow_runs" --jq \
              ".workflow_runs | map(select(.id > ($BASELINE_RUN_ID | tonumber) and .head_branch == \"codex-staging\" and .head_sha == \"$CANDIDATE\" and .event == \"push\")) | sort_by(.id) | .[0].id // empty")
            test -z "$run_id" || break
            sleep 5
          done
          test -n "$run_id" || {
            echo "::error::no CI run appeared for codex-staging at $CANDIDATE"
            exit 1
          }

          conclusion=
          url=
          for attempt in $(seq 1 180)
          do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(jq -r .status <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")
            url=$(jq -r .html_url <<<"$run")
            test "$status" != completed || break
            sleep 30
          done
          test "$status" = completed || {
            echo "::error::CI run $run_id did not complete before the timeout"
            exit 1
          }
          test "$conclusion" = success || {
            echo "::error::CI failed for exact staging SHA $CANDIDATE: $url"
            exit 1
          }

          jobs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          config_conclusion=$(jq -r \
            '[.jobs[] | select(.name == "config")][0].conclusion // empty' \
            <<<"$jobs")
          test "$config_conclusion" = success || {
            echo "::error::CI config did not run successfully on codex-staging"
            exit 1
          }
          {
            echo '## Staging CI'
            echo
            echo "Candidate: \`$CANDIDATE\`"
            echo "Full CI: [$run_id]($url)"
          } >>"$GITHUB_STEP_SUMMARY"

  topics:
    name: Topic ${{ matrix.topic }}
    needs:
      - prepare
      - stage
    if: >-
      needs.stage.result == 'success' &&
      needs.prepare.outputs.run-attempt == format('{0}', github.run_attempt)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.topics) }}
    uses: openai/git/.github/workflows/codex-topic.yml@meta
    with:
      topic: ${{ matrix.topic }}
      old-topic-oid: ${{ matrix.old_topic_oid }}
      rewritten-prerequisite-oid: ${{ matrix.rewritten_prerequisite_oid }}
      rewritten-topic-oid: ${{ matrix.rewritten_topic_oid }}
      staging-oid: ${{ needs.stage.outputs.staging-oid }}
      controller-oid: ${{ needs.prepare.outputs.controller-oid }}
    permissions:
      contents: read

  promote:
    name: Atomically promote topics and codex
    needs:
      - prepare
      - stage
      - topics
    if: >-
      needs.stage.result == 'success' &&
      needs.topics.result == 'success' &&
      needs.prepare.outputs.run-attempt == format('{0}', github.run_attempt)
    runs-on: ubuntu-24.04
    environment: codex-publish
    steps:
      - name: Check out the pinned controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/codex-candidate

      - name: Import and verify the candidate bundle
        env:
          CONTROLLER_OID: ${{ needs.prepare.outputs.controller-oid }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$CONTROLLER_OID"
          metadata="$RUNNER_TEMP/codex-candidate"
          git bundle verify "$metadata/codex.bundle"
          git fetch "$metadata/codex.bundle" \
            refs/codex-output/candidate:refs/codex-import/candidate
          test "$(git rev-parse refs/codex-import/candidate)" = \
            "$(cat "$metadata/codex-candidate")"

      - name: Revalidate and atomically promote
        env:
          CONTROLLER_OID: ${{ needs.prepare.outputs.controller-oid }}
          GH_TOKEN: ${{ secrets.CODEX_BRANCH_TOKEN }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_SHA" = "$CONTROLLER_OID"
          test -n "$GH_TOKEN" || {
            echo '::error::CODEX_BRANCH_TOKEN is required to promote codex'
            exit 1
          }
          metadata="$RUNNER_TEMP/codex-candidate"
          gh auth setup-git
          sh "$GITHUB_WORKSPACE/.github/workflows/codex-branch.sh" promote \
            --staging codex-staging \
            --require-automation \
            --inputs "$metadata/codex-inputs" \
            --updates "$metadata/codex-updates"

      - name: Summarize promotion
        run: |
          candidate=$(cat "$RUNNER_TEMP/codex-candidate/codex-candidate")
          {
            echo '## Published codex'
            echo
            echo "Promoted: \`$candidate\`"
            echo 'Deleted: `refs/heads/codex-staging`'
          } >>"$GITHUB_STEP_SUMMARY"
