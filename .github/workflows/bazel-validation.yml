name: Bazel archive validation

on:
  push:
    branches: [tb/codex/bazel-build-check-138]

permissions:
  contents: read

env:
  USE_BAZEL_VERSION: 9.2.0

concurrency:
  group: bazel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            toolchain: --extra_toolchains=@llvm//toolchain:all --@curl//:ssl_lib=openssl
          - runner: ubuntu-22.04-arm
            toolchain: --extra_toolchains=@llvm//toolchain:all --@curl//:ssl_lib=openssl
          - runner: macos-15-intel
            toolchain: --@curl//:ssl_lib=openssl
          - runner: macos-15
            toolchain: --@curl//:ssl_lib=openssl
          - runner: windows-2025
            toolchain: --extra_toolchains=@llvm//toolchain:all --compiler=clang --@curl//:ssl_lib=schannel
          - runner: windows-11-arm
            toolchain: --extra_toolchains=@llvm//toolchain:all --compiler=clang --@curl//:ssl_lib=schannel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build binaries, helpers, and runtime data
        run: bazel build -c opt ${{ matrix.toolchain }} @git//:git @git//:scalar @git//:git-shell @git//:git-daemon @git//:git-http-backend @git//:git-http-fetch @git//:git-http-push @git//:git-imap-send @git//:git-remote-http @git//:git-sh-i18n--envsubst @git//:git_difftool__helper @git//:git_filter_branch @git//:git_merge_octopus @git//:git_merge_one_file @git//:git_merge_resolve @git//:git_mergetool @git//:git_quiltimport @git//:git_request_pull @git//:git_submodule @git//:git_web__browse @git//:git_sh_i18n @git//:git_sh_setup @git//:git_mergetool__lib @git//:git_version_file @git//:templates @git//:mergetools
      - name: Check transport features
        run: bazel test -c opt --test_output=errors ${{ matrix.toolchain }} //contrib/bazel/validation:transport_features_test
      - name: Exercise the executable
        run: |
          git_binary="$PWD/$(bazel cquery -c opt ${{ matrix.toolchain }} @git//:git --output=files)"
          "$git_binary" version --build-options
          test_dir=$(mktemp -d)
          "$git_binary" init --template= "$test_dir"
          printf 'hello 123\n' > "$test_dir/file.txt"
          "$git_binary" -C "$test_dir" add file.txt
          "$git_binary" -C "$test_dir" grep --cached -P '[0-9]+'
          "$git_binary" -C "$test_dir" -c user.name=Test -c user.email=test@example.invalid commit -m initial
          "$git_binary" -C "$test_dir" repack -ad
          "$git_binary" -C "$test_dir" fsck --strict
